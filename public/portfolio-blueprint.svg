<svg viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg" className="w-full h-full">
  <!-- Background with dark graphite theme -->
  <rect width="800" height="500" fill="#0B0D10"/>

  <!-- Blueprint Grid -->
  <defs>
    <pattern id="bp-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A2B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4DE1C1" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bp-grid)"/>

  <!-- Corner registration marks -->
  <g stroke="#FF6A2B" stroke-width="1" opacity="0.8">
    <path d="M 20 15 L 20 25 M 15 20 L 25 20"/>
    <path d="M 780 15 L 780 25 M 775 20 L 785 20"/>
    <path d="M 20 485 L 20 475 M 15 480 L 25 480"/>
    <path d="M 780 485 L 780 475 M 775 480 L 785 480"/>
  </g>

  <!-- Border Hairline Box -->
  <rect x="35" y="35" width="730" height="430" rx="4" fill="#12151B" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>

  <!-- Window Header Bar -->
  <line x1="35" y1="75" x2="765" y2="75" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="55" cy="55" r="4.5" fill="#FF6A2B"/>
  <circle cx="70" cy="55" r="4.5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="85" cy="55" r="4.5" fill="#10B981" opacity="0.8"/>
  <text x="110" y="59" fill="#8A95A3" font-family="monospace" font-size="11" letter-spacing="1.5">// THE SYSTEMS BLUEPRINT · ARCHITECTURE SHOWCASE</text>
  <text x="735" y="59" fill="#FF6A2B" font-family="monospace" font-size="11" text-anchor="end">SYS_STATUS: OPTIMAL</text>

  <!-- Content Split: Hero Left & Diagram Right -->
  <!-- Left Side: Editorial Typography -->
  <text x="65" y="125" fill="#FF6A2B" font-family="monospace" font-size="11" letter-spacing="2">// VP OF ENGINEERING · FULL-STACK · AI SYSTEMS</text>
  <text x="65" y="175" fill="#EDEBE8" font-family="serif" font-size="34" font-weight="600">I build the <tspan fill="#FF6A2B" font-style="italic">systems</tspan></text>
  <text x="65" y="215" fill="#EDEBE8" font-family="serif" font-size="34" font-weight="600">behind intelligent products.</text>
  <text x="65" y="250" fill="#8A95A3" font-family="sans-serif" font-size="13">Architecting scalable platforms, AI-driven automation, and resilient APIs.</text>

  <!-- Metrics Chips -->
  <g transform="translate(65, 275)">
    <rect width="105" height="48" rx="2" fill="#0B0D10" stroke="rgba(255,106,43,0.4)" stroke-width="1"/>
    <text x="12" y="22" fill="#FF6A2B" font-family="monospace" font-size="16" font-weight="bold">+35%</text>
    <text x="12" y="38" fill="#8A95A3" font-family="sans-serif" font-size="9">Delivery Velocity</text>

    <rect x="115" width="105" height="48" rx="2" fill="#0B0D10" stroke="rgba(77,225,193,0.4)" stroke-width="1"/>
    <text x="127" y="22" fill="#4DE1C1" font-family="monospace" font-size="16" font-weight="bold">3×</text>
    <text x="127" y="38" fill="#8A95A3" font-family="sans-serif" font-size="9">AI Usage Scale</text>

    <rect x="230" width="105" height="48" rx="2" fill="#0B0D10" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="242" y="22" fill="#EDEBE8" font-family="monospace" font-size="16" font-weight="bold">-45%</text>
    <text x="242" y="38" fill="#8A95A3" font-family="sans-serif" font-size="9">Incidents</text>
  </g>

  <!-- Right Side: Architecture Node Graph -->
  <g transform="translate(435, 115)">
    <rect width="300" height="235" rx="3" fill="#0B0D10" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Nodes -->
    <!-- Gateway -->
    <rect x="25" y="35" width="80" height="35" rx="2" fill="#12151B" stroke="#8A95A3" stroke-width="1"/>
    <text x="65" y="57" fill="#EDEBE8" font-family="monospace" font-size="10" text-anchor="middle">Gateway</text>

    <!-- Services -->
    <rect x="195" y="35" width="80" height="35" rx="2" fill="#12151B" stroke="#4DE1C1" stroke-width="1"/>
    <text x="235" y="57" fill="#4DE1C1" font-family="monospace" font-size="10" text-anchor="middle">Workers</text>

    <!-- Database -->
    <rect x="25" y="145" width="80" height="35" rx="2" fill="#12151B" stroke="#8A95A3" stroke-width="1"/>
    <text x="65" y="167" fill="#EDEBE8" font-family="monospace" font-size="10" text-anchor="middle">Postgres</text>

    <!-- LLM Core -->
    <rect x="195" y="145" width="80" height="35" rx="2" fill="#12151B" stroke="#FF6A2B" stroke-width="1.2"/>
    <circle cx="265" cy="152" r="3" fill="#FF6A2B"/>
    <text x="235" y="167" fill="#FF6A2B" font-family="monospace" font-size="10" text-anchor="middle">LLM Core</text>

    <!-- Connectors -->
    <path d="M 105 52 L 195 52" stroke="#4DE1C1" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M 65 70 L 65 145" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>
    <path d="M 235 70 L 235 145" stroke="#FF6A2B" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M 105 162 L 195 162" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  </g>

  <!-- Bottom Telemetry Footer Strip -->
  <g transform="translate(65, 375)">
    <rect width="670" height="60" rx="2" fill="#0B0D10" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="25" fill="#8A95A3" font-family="monospace" font-size="10">// DEPLOYMENT SPECIFICATION</text>
    <text x="20" y="44" fill="#EDEBE8" font-family="monospace" font-size="11">Next.js 15 App Router · TypeScript · Dual Graphite/Paper · 102kB First Load JS · WCAG AA</text>
    <text x="650" y="35" fill="#4DE1C1" font-family="monospace" font-size="11" text-anchor="end">100% STATIC PRE-RENDERED</text>
  </g>
</svg>

